name: Release Pack

on:
  push:
    tags:
      - "pack/*/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_packs.py
      - run: python -m unittest discover -s tests
      - name: Resolve and validate Pack release
        id: pack
        run: python scripts/resolve_pack_release.py --tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: python scripts/build_packs.py --output dist --pack "${{ steps.pack.outputs.name }}" --verify-deterministic
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pack.zip --verify-tag --generate-notes
