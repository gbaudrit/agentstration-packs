name: Release Pack

on:
  push:
    tags:
      - "pack/*/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_packs.py
      - name: Resolve Pack
        shell: bash
        run: |
          value="${GITHUB_REF_NAME#pack/}"
          echo "PACK_NAME=${value%/v*}" >> "$GITHUB_ENV"
      - run: python scripts/build_packs.py --output dist --pack "$PACK_NAME" --verify-deterministic
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pack.zip --verify-tag --generate-notes
