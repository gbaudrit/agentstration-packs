name: Validate Packs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.pack-matrix.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_packs.py
      - run: python scripts/generate_catalog.py --check
      - id: pack-matrix
        name: Discover Packs
        run: echo "packs=$(python scripts/build_packs.py --list-json)" >> "$GITHUB_OUTPUT"

  build-pack:
    name: Build ${{ matrix.pack }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.validate.outputs.packs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_packs.py --pack "${{ matrix.pack }}" --output dist --verify-deterministic
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.pack }}
          path: dist/${{ matrix.pack }}-*.pack.zip
          if-no-files-found: error
