name: Validate Packs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_packs.py
      - run: python scripts/generate_catalog.py --check
      - run: python scripts/build_packs.py --output dist --verify-deterministic
      - uses: actions/upload-artifact@v4
        with:
          name: agentstration-packs
          path: dist/*.pack.zip
          if-no-files-found: error
