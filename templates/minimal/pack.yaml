apiVersion: agentstration.io/v1
kind: Pack
metadata:
  name: replace-me
  publisher: agentstration
  version: 0.1.0
  audience: universal
  purpose: template
  displayName: Replace Me
  description: Replace this description.
  categories: [template]
  tags: [orchestration, sequential]
definition:
  bindings:
    - name: agent-model
      targetKind: modelProfile
      displayName: Agent model
      description: Model profile used by all agents in this Pack.
      required: true
  resources:
    - agents/first.yaml
    - agents/final.yaml
    - flows/main.yaml
    - entries/main.yaml
