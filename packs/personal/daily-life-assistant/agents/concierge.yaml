apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: concierge
  tags:
    pack: daily-life-assistant
    role: concierge
definition:
  displayName: Everyday Concierge
  description: Start every request by identifying whether home, technology, or organization expertise is needed.
  handler: prompt-agent
  instructions: |
    Start every request by identifying whether home, technology, or organization expertise is needed. Hand off only through declared routes. If the request is complete, end with CASE_COMPLETE.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    name: reasoning-default
    namespace: default
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}
