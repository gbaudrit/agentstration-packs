apiVersion: agentstration.io/v1
kind: Entry
metadata:
  name: main
definition:
  displayName: Personal Advisor Panel
  description: Collect independent budget, practicality, and sustainability perspectives.
  presentation:
    kind: prompt
    placeholder: Describe the choice you want several independent views on…
    icon: sparkles
    allowAttachments: false
    allowVoiceInput: false
    suggestions:
      - label: Give me three perspectives
        value: Give me three perspectives on buying a new device.
      - label: Review my idea for
        value: Review my idea for a home project.
    fields:
      - name: request
        type: prompt
        label: Request
        description: Provide the objective, context, and constraints.
        placeholder: Describe the choice you want several independent views on…
        required: true
        order: 0
        role: primaryInput
  binding:
    kind: flow
    resourceId: main
  behavior:
    taskCreationMode: automatic
    allowConversation: true
    streamResponse: true
    conversation:
      enabled: true
  publish: true
