apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: critical-reviewer
  tags:
    pack: design-review-room
    role: critical-reviewer
definition:
  displayName: Critical Reviewer
  description: Challenge assumptions, surface risks and alternatives, and distinguish blockers from acceptable trade-offs.
  handler: prompt-agent
  instructions: |
    Challenge assumptions, surface risks and alternatives, and distinguish blockers from acceptable trade-offs.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    binding: agent-model
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

