apiVersion: agentstration.io/v1
kind: Pack
metadata:
  name: brief-to-spec
  publisher: agentstration
  version: 0.1.0
  audience: professional
  purpose: sample
  displayName: Brief to Spec
  description: Turn a product or engineering brief into a reviewed implementation specification.
  categories:
    - professional-productivity
    - product-development
  tags:
    - orchestration
    - sequential
    - offline-compatible
definition:
  bindings:
    - name: agent-model
      targetKind: modelProfile
      displayName: Agent model
      description: Model profile used by all agents in this Pack.
      required: true
  resources:
    - agents/requirements-analyst.yaml
    - agents/solution-designer.yaml
    - agents/quality-reviewer.yaml
    - flows/brief-to-spec.yaml
    - entries/brief-to-spec.yaml
