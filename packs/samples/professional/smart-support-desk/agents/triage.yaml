apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: triage
  tags:
    pack: smart-support-desk
    role: triage
definition:
  displayName: Support Triage
  description: Classify the request as technical, account, or billing.
  handler: prompt-agent
  instructions: |
    Classify the request as technical, account, or billing. Ask no external user for additional input during this autonomous run. Hand off only through declared routes and end resolved guidance with CASE_RESOLVED.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    name: reasoning-default
    namespace: default
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

