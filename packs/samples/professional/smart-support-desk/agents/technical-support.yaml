apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: technical-support
  tags:
    pack: smart-support-desk
    role: technical-support
definition:
  displayName: Technical Support
  description: Provide safe technical diagnosis and reversible troubleshooting.
  handler: prompt-agent
  instructions: |
    Provide safe technical diagnosis and reversible troubleshooting. Never claim access to systems. Return to triage if misrouted and end complete guidance with CASE_RESOLVED.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    name: reasoning-default
    namespace: default
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

