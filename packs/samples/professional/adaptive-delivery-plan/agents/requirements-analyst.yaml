apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: requirements-analyst
  tags:
    pack: adaptive-delivery-plan
    role: requirements-analyst
definition:
  displayName: Requirements Analyst
  description: Clarify objectives, scope, stakeholders, constraints, dependencies, assumptions, and measurable outcomes.
  handler: prompt-agent
  instructions: |
    Clarify objectives, scope, stakeholders, constraints, dependencies, assumptions, and measurable outcomes.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    binding: agent-model
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

