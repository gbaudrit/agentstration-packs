apiVersion: agentstration.io/v1
kind: Flow
metadata:
  name: adaptive-delivery-plan
definition:
  displayName: Adaptive Delivery Plan
  description: Adaptively coordinate specialists to build a delivery plan for a complex initiative.
  version: 0.1.0
  enabled: true
  spec:
    flowKind: orchestration
    participants:
      - kind: agent
        id: requirements-analyst
      - kind: agent
        id: solution-architect
      - kind: agent
        id: risk-analyst
      - kind: agent
        id: delivery-planner
    pattern:
      strategy: magentic
      manager:
        kind: agent
        id: delivery-manager
      maximumRounds: 12
      maximumStalls: 3
      maximumResets: 1
  metadata:
    pack: adaptive-delivery-plan
    audience: professional
    strategy: magentic
  publish: true
  activate: true
