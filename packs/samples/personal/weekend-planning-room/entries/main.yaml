apiVersion: agentstration.io/v1
kind: Entry
metadata:
  name: main
definition:
  displayName: Weekend Planning Room
  description: Build a balanced weekend plan through one bounded shared discussion.
  presentation:
    kind: prompt
    placeholder: Describe the weekend, people, constraints, and preferences…
    icon: sparkles
    allowAttachments: false
    allowVoiceInput: false
    suggestions:
      - label: Plan a relaxed weekend
        value: Plan a relaxed weekend with a modest budget.
      - label: Plan a rainy family
        value: Plan a rainy family weekend at home.
    fields:
      - name: request
        type: prompt
        label: Request
        description: Provide the objective, context, and constraints.
        placeholder: Describe the weekend, people, constraints, and preferences…
        required: true
        order: 0
        role: primaryInput
  binding:
    kind: flow
    resourceId: main
  behavior:
    taskCreationMode: automatic
    allowConversation: true
    streamResponse: true
    conversation:
      enabled: true
  publish: true

