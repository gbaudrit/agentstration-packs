apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: plan-editor
  tags:
    pack: weekend-planning-room
    role: plan-editor
definition:
  displayName: Plan Editor
  description: Synthesize the shared discussion into a concise schedule with options, checklist, assumptions, and fallback choices.
  handler: prompt-agent
  instructions: |
    Synthesize the shared discussion into a concise schedule with options, checklist, assumptions, and fallback choices.
