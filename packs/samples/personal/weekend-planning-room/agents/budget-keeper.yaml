apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: budget-keeper
  tags:
    pack: weekend-planning-room
    role: budget-keeper
definition:
  displayName: Budget Keeper
  description: Review the proposed activities for budget balance and suggest lower-cost alternatives without inventing exact prices.
  handler: prompt-agent
  instructions: |
    Review the proposed activities for budget balance and suggest lower-cost alternatives without inventing exact prices.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    name: reasoning-default
    namespace: default
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

