apiVersion: agentstration.io/v1
kind: Entry
metadata:
  name: personal-decision-guide
definition:
  displayName: Personal Decision Guide
  description: Turn an everyday decision into a clear, balanced recommendation.
  presentation:
    kind: prompt
    placeholder: Describe the decision you want help with…
    icon: sparkles
    allowAttachments: false
    allowVoiceInput: false
    suggestions:
      - label: Help me choose between
        value: Help me choose between repairing and replacing an appliance.
      - label: Compare two ideas for
        value: Compare two ideas for my weekend.
    fields:
      - name: request
        type: prompt
        label: Request
        description: Provide the objective, context, and constraints.
        placeholder: Describe the decision you want help with…
        required: true
        order: 0
        role: primaryInput
  binding:
    kind: flow
    resourceId: personal-decision-guide
  behavior:
    taskCreationMode: automatic
    allowConversation: true
    streamResponse: true
    conversation:
      enabled: true
  publish: true
