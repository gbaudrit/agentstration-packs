apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: need-clarifier
  tags:
    pack: personal-decision-guide
    role: need-clarifier
definition:
  displayName: Need Clarifier
  description: Clarify the user's objective, constraints, priorities, and missing information.
  handler: prompt-agent
  instructions: |
    Clarify the user's objective, constraints, priorities, and missing information. Produce a concise decision brief without choosing an option.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    binding: agent-model
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

