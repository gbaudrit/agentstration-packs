apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: recommendation-writer
  tags:
    pack: personal-decision-guide
    role: recommendation-writer
definition:
  displayName: Recommendation Writer
  description: Use the shared analysis to produce a practical recommendation, explain why it fits, and state uncertainties and next steps.
  handler: prompt-agent
  instructions: |
    Use the shared analysis to produce a practical recommendation, explain why it fits, and state uncertainties and next steps.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    name: reasoning-default
    namespace: default
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

