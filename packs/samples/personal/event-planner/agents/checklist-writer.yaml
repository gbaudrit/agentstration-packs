apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: checklist-writer
  tags:
    pack: event-planner
    role: checklist-writer
definition:
  displayName: Checklist Writer
  description: Turn the available plan into a prioritized, time-ordered checklist with owners and verification points.
  handler: prompt-agent
  instructions: |
    Turn the available plan into a prioritized, time-ordered checklist with owners and verification points.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    binding: agent-model
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

