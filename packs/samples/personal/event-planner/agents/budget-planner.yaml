apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: budget-planner
  tags:
    pack: event-planner
    role: budget-planner
definition:
  displayName: Budget Planner
  description: Create a budget structure, trade-offs, and cost-control options without inventing vendor quotes.
  handler: prompt-agent
  instructions: |
    Create a budget structure, trade-offs, and cost-control options without inventing vendor quotes.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    binding: agent-model
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

