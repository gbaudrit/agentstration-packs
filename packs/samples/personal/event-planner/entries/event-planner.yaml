apiVersion: agentstration.io/v1
kind: Entry
metadata:
  name: event-planner
definition:
  displayName: Adaptive Event Planner
  description: Adaptively coordinate specialists to prepare a small personal event.
  presentation:
    kind: prompt
    placeholder: Describe the event and its constraints…
    icon: sparkles
    allowAttachments: false
    allowVoiceInput: false
    suggestions:
      - label: Plan a small family
        value: Plan a small family birthday at home.
      - label: Prepare a weekend gathering
        value: Prepare a weekend gathering for twelve people.
    fields:
      - name: request
        type: prompt
        label: Request
        description: Provide the objective, context, and constraints.
        placeholder: Describe the event and its constraints…
        required: true
        order: 0
        role: primaryInput
  binding:
    kind: flow
    resourceId: event-planner
  behavior:
    taskCreationMode: automatic
    allowConversation: true
    streamResponse: true
    conversation:
      enabled: true
  publish: true
