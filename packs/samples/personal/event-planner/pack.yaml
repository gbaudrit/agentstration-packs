apiVersion: agentstration.io/v1
kind: Pack
metadata:
  name: event-planner
  publisher: agentstration
  version: 0.1.0
  audience: personal
  purpose: sample
  displayName: Adaptive Event Planner
  description: Adaptively coordinate specialists to prepare a small personal event.
  categories:
    - events
    - planning
  tags:
    - orchestration
    - magentic
    - offline-compatible
definition:
  bindings:
    - name: agent-model
      targetKind: modelProfile
      displayName: Agent model
      description: Model profile used by all agents in this Pack.
      required: true
  resources:
    - agents/event-coordinator.yaml
    - agents/program-designer.yaml
    - agents/logistics-planner.yaml
    - agents/budget-planner.yaml
    - agents/checklist-writer.yaml
    - flows/event-planner.yaml
    - entries/event-planner.yaml
