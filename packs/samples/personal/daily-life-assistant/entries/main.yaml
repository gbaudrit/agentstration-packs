apiVersion: agentstration.io/v1
kind: Entry
metadata:
  name: main
definition:
  displayName: Daily Life Assistant
  description: Route an everyday request to the most relevant declared specialist.
  presentation:
    kind: prompt
    placeholder: Describe what you need help with…
    icon: sparkles
    allowAttachments: false
    allowVoiceInput: false
    suggestions:
      - label: Help me organize a
        value: Help me organize a busy week.
      - label: My phone will not
        value: My phone will not connect to my television.
    fields:
      - name: request
        type: prompt
        label: Request
        description: Provide the objective, context, and constraints.
        placeholder: Describe what you need help with…
        required: true
        order: 0
        role: primaryInput
  binding:
    kind: flow
    resourceId: main
  behavior:
    taskCreationMode: automatic
    allowConversation: true
    streamResponse: true
    conversation:
      enabled: true
  publish: true

