apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: tech-specialist
  tags:
    pack: daily-life-assistant
    role: tech-specialist
definition:
  displayName: Technology Specialist
  description: Handle consumer technology troubleshooting using safe, reversible steps.
  handler: prompt-agent
  instructions: |
    Handle consumer technology troubleshooting using safe, reversible steps. Never claim device access. Return to the concierge if the request belongs elsewhere and end a complete answer with CASE_COMPLETE.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    name: reasoning-default
    namespace: default
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}

