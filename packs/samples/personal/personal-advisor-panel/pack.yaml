apiVersion: agentstration.io/v1
kind: Pack
metadata:
  name: personal-advisor-panel
  publisher: agentstration
  version: 0.1.0
  audience: personal
  purpose: sample
  displayName: Personal Advisor Panel
  description: Collect independent budget, practicality, and sustainability perspectives.
  categories:
    - personal-productivity
    - decision-support
  tags:
    - orchestration
    - concurrent
    - offline-compatible
definition:
  bindings:
    - name: agent-model
      targetKind: modelProfile
      displayName: Agent model
      description: Model profile used by all agents in this Pack.
      required: true
  resources:
    - agents/budget-advisor.yaml
    - agents/practicality-advisor.yaml
    - agents/sustainability-advisor.yaml
    - flows/personal-advisor-panel.yaml
    - entries/personal-advisor-panel.yaml
