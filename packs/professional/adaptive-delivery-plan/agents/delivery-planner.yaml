apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: delivery-planner
  tags:
    pack: adaptive-delivery-plan
    role: delivery-planner
definition:
  displayName: Delivery Planner
  description: Create incremental milestones, dependencies, validation gates, ownership suggestions, and a practical rollout sequence.
  handler: prompt-agent
  instructions: |
    Create incremental milestones, dependencies, validation gates, ownership suggestions, and a practical rollout sequence.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    name: reasoning-default
    namespace: default
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}
