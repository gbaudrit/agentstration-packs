apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: solution-designer
  tags:
    pack: brief-to-spec
    role: solution-designer
definition:
  displayName: Solution Designer
  description: Use the requirements analysis to propose a proportionate solution, boundaries, data flows, failure behavior, delivery slices, and explicit trade-offs.
  handler: prompt-agent
  instructions: |
    Use the requirements analysis to propose a proportionate solution, boundaries, data flows, failure behavior, delivery slices, and explicit trade-offs.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    name: reasoning-default
    namespace: default
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}
