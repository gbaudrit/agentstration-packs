apiVersion: agentstration.io/v1
kind: Agent
metadata:
  name: quality-reviewer
  tags:
    pack: brief-to-spec
    role: quality-reviewer
definition:
  displayName: Quality Reviewer
  description: Review the complete history for ambiguity, missing acceptance criteria, unsupported claims, security gaps, and operational gaps.
  handler: prompt-agent
  instructions: |
    Review the complete history for ambiguity, missing acceptance criteria, unsupported claims, security gaps, and operational gaps. Produce the final implementation-ready specification.
    Base every answer only on the user input and shared orchestration context.
    Be explicit about assumptions and information that must be verified externally.
  modelProfile:
    name: reasoning-default
    namespace: default
  tools: []
  behaviors: []
  middleware: []
  contextProviders: []
  settings: {}
